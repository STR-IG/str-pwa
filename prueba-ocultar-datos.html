<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba privada · Ocultar datos · STR-IG</title>
<style>body{font:16px system-ui;margin:0;background:#f5f5f5;color:#222}main{max-width:760px;margin:auto;padding:18px}h1{font-size:1.5rem}button,.pick{display:inline-block;padding:12px;border:1px solid #a90010;border-radius:9px;background:#fff;color:#a90010;font:inherit;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.4}canvas{display:block;width:100%;height:auto;touch-action:none;border:2px solid #d00;background:white}section{background:white;padding:14px;border-radius:12px;margin:14px 0}.notice{background:#fff4f4;padding:12px;border-left:4px solid #d00}label{display:block;margin:12px 0}input[type=file]{max-width:100%}</style></head>
<body><main><h1>Prueba: ocultar datos personales</h1><p class="notice">Prueba aislada. No sube documentos a STR-IG, Supabase ni ningún servidor. Utiliza una imagen de prueba, nunca una nómina real en esta fase.</p>
<section><label>1. Selecciona una imagen JPG o PNG de prueba <input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><p>2. Arrastra el dedo sobre los datos para dibujar rectángulos negros permanentes. Puedes deshacer el último rectángulo.</p><button id="undo" disabled>Deshacer último</button><button id="reset" disabled>Empezar de nuevo</button><canvas id="canvas" aria-label="Vista previa de la imagen para ocultar datos"></canvas></section>
<section><label><input id="confirm" type="checkbox"> He comprobado que todos los datos personales innecesarios están ocultos.</label><button id="export" disabled>Generar imagen protegida</button><p id="status" role="status"></p></section></main>
<script>
'use strict';
const file=document.querySelector('#file'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),undo=document.querySelector('#undo'),reset=document.querySelector('#reset'),confirmBox=document.querySelector('#confirm'),exportBtn=document.querySelector('#export'),status=document.querySelector('#status');
let img=null,rects=[],drag=null;
function point(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(canvas.width,(e.clientX-r.left)*canvas.width/r.width)),y:Math.max(0,Math.min(canvas.height,(e.clientY-r.top)*canvas.height/r.height))}}
function rect(a,b){return{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)}}
function draw(){if(!img)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.fillStyle='#000';for(const r of rects)ctx.fillRect(r.x,r.y,r.w,r.h);if(drag){const r=rect(drag.start,drag.end);ctx.fillRect(r.x,r.y,r.w,r.h)}undo.disabled=!rects.length;reset.disabled=false;exportBtn.disabled=!confirmBox.checked||!rects.length}
file.onchange=()=>{const f=file.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)){status.textContent='Selecciona una imagen JPG, PNG o WebP.';return}const url=URL.createObjectURL(f);const next=new Image();next.onload=()=>{URL.revokeObjectURL(url);img=next;canvas.width=next.naturalWidth;canvas.height=next.naturalHeight;rects=[];drag=null;confirmBox.checked=false;status.textContent='Imagen cargada solo en este dispositivo.';draw()};next.onerror=()=>{URL.revokeObjectURL(url);status.textContent='No se pudo abrir la imagen.'};next.src=url};
canvas.onpointerdown=e=>{if(!img)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drag={start:point(e),end:point(e)};draw()};
canvas.onpointermove=e=>{if(!drag)return;drag.end=point(e);draw()};
canvas.onpointerup=e=>{if(!drag)return;drag.end=point(e);const r=rect(drag.start,drag.end);if(r.w>2&&r.h>2){rects.push(r);confirmBox.checked=false}drag=null;draw()};
canvas.onpointercancel=()=>{drag=null;draw()};
undo.onclick=()=>{rects.pop();confirmBox.checked=false;draw()};
reset.onclick=()=>{rects=[];confirmBox.checked=false;draw()};
confirmBox.onchange=draw;
exportBtn.onclick=()=>{if(!img||!rects.length||!confirmBox.checked)return;draw();const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const g=out.getContext('2d',{alpha:false});g.fillStyle='#fff';g.fillRect(0,0,out.width,out.height);g.drawImage(img,0,0,out.width,out.height);g.fillStyle='#000';for(const r of rects)g.fillRect(r.x,r.y,r.w,r.h);out.toBlob(blob=>{if(!blob){status.textContent='No se pudo generar la imagen';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='documento-sin-datos-personales.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status.textContent='Imagen nueva generada localmente. El original no se ha subido.'},'image/png')};
</script></body></html>
