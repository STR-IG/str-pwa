<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e30613"><title>Presencia inmediata · Fuerza mayor familiar</title><link rel="icon" type="image/png" href="icono-str-ig.png"><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--red:#e30613;--red-dark:#b9000b;--black:#161616;--grey:#6e6e73;--line:#dddddf;--light:#f5f5f7}body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--black)}.top{padding:calc(14px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid #e4e4e7}.top-inner{display:flex;align-items:center;gap:14px;max-width:680px;margin:auto}.back{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--red);background:#fff;text-decoration:none;font-size:26px;font-weight:700}h1{font-size:clamp(21px,5vw,27px)}main{max-width:680px;margin:auto;padding:24px 18px 48px}.panel{padding:22px;border-radius:22px;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.07)}.step{color:var(--red-dark);font-size:12px;font-weight:900;text-transform:uppercase}h2{margin:10px 0 8px;font-size:24px}.intro{margin-bottom:18px;color:var(--grey);line-height:1.5}.options{display:grid;gap:12px}.option{width:100%;min-height:56px;border:1px solid var(--line);border-radius:15px;background:#fff;font:inherit;font-size:16px;font-weight:800}.option.selected{border-color:var(--red);box-shadow:0 0 0 3px rgba(227,6,19,.1)}.primary{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:999px;color:#fff;background:var(--red);font:inherit;font-weight:800}.primary:disabled{opacity:.45}#auth-check{text-align:center;color:var(--grey)}</style></head><body><header class="top"><div class="top-inner"><a class="back" href="preguntale-fuerza-mayor-motivo.html">‹</a><h1>Fuerza mayor familiar</h1></div></header><main><p id="auth-check">Comprobando acceso privado…</p><section id="content" hidden><div class="panel"><span class="step">Paso 3 de 5</span><h2>¿La situación requiere tu presencia inmediata e indispensable?</h2><p class="intro">Selecciona la opción que mejor describe tu caso. La valoración final la realizará la orientación de STR-IG.</p><div class="options"><button class="option" data-value="Sí">Sí</button><button class="option" data-value="No">No</button></div><button id="continue" class="primary" disabled>Continuar</button></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://icneigdnuntzugisexaz.supabase.co',KEY='sb_publishable_apKjcPClIBTHS2wwN6qPsA_6Vm4tk9m',PAGE='preguntale-fuerza-mayor-presencia.html';const supabase=createClient(URL,KEY,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});async function allowed(s){if(!s)return false;const{data,error}=await supabase.rpc('is_current_user_private_access_allowed');return!error&&data===true}const{data:{session}}=await supabase.auth.getSession();if(!(await allowed(session))){if(session)await supabase.auth.signOut();sessionStorage.setItem('strAfterLogin',PAGE);location.replace(`acceso-privado.html?next=${PAGE}`)}else{document.getElementById('auth-check').hidden=true;document.getElementById('content').hidden=false}let value=sessionStorage.getItem('strForceMajeurePresence')||'';const buttons=[...document.querySelectorAll('.option')],next=document.getElementById('continue');function paint(){buttons.forEach(b=>b.classList.toggle('selected',b.dataset.value===value));next.disabled=!value}buttons.forEach(b=>b.onclick=()=>{value=b.dataset.value;paint()});paint();next.onclick=()=>{if(!value)return;sessionStorage.setItem('strForceMajeurePresence',value);location.assign('preguntale-fuerza-mayor-fecha.html')};</script></body></html>
