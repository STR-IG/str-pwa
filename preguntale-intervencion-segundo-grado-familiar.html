<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://icneigdnuntzugisexaz.supabase.co',KEY='sb_publishable_apKjcPClIBTHS2wwN6qPsA_6Vm4tk9m',PAGE='preguntale-intervencion-segundo-grado-familiar.html';const supabase=createClient(URL,KEY,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});async function hasPrivateAccess(session){if(!session)return false;const{data,error}=await supabase.rpc('is_current_user_private_access_allowed');return!error&&data===true}const{data:{session}}=await supabase.auth.getSession();if(!(await hasPrivateAccess(session))){if(session)await supabase.auth.signOut();sessionStorage.setItem('strAfterLogin',PAGE);window.location.replace(`acceso-privado.html?next=${PAGE}`)}else{document.getElementById('auth-check').hidden=true;document.getElementById('content').hidden=false}const relationship=document.getElementById('relationship'),continueButton=document.getElementById('continue'),result=document.getElementById('result');const savedRelationship=sessionStorage.getItem('strInterventionSecondDegreeRelationship');if(savedRelationship){const savedOption=Array.from(relationship.options).find(option=>option.text===savedRelationship);if(savedOption)relationship.selectedIndex=savedOption.index}continueButton.disabled=!relationship.value;relationship.addEventListener('change',()=>{continueButton.disabled=!relationship.value;result.className='result';result.replaceChildren()});continueButton.addEventListener('click',()=>{if(!relationship.value)return;const selected=relationship.options[relationship.selectedIndex]?.text||'La opción seleccionada';sessionStorage.setItem('strInterventionSecondDegreeRelationship',selected);window.location.href='preguntale-intervencion-segundo-grado-fecha.html'});
