name: One-time permisos link update

on:
  push:
    paths:
      - '.github/workflows/one-time-permisos-link.yml'

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point Permisos card to dedicated screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<a href="#permisos" class="quick-card" style="padding:0; overflow:hidden;">'
          new = '<a href="permisos.html" class="quick-card" style="padding:0; overflow:hidden;">'
          if old not in text:
              raise SystemExit('Expected Permisos link not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Open Permisos in dedicated screen"
          git push
