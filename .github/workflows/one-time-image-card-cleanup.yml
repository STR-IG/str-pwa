name: One-time image card cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-image-card-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove white frame from image cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          replacements = [
              ('<a href="permisos.html" class="quick-card" style="padding:0; overflow:hidden;">',
               '<a href="permisos.html" class="quick-card" style="padding:0; overflow:hidden; background:transparent; box-shadow:none;">'),
              ('<a href="#menu" class="quick-card" style="padding:0; overflow:hidden;">',
               '<a href="#menu" class="quick-card" style="padding:0; overflow:hidden; background:transparent; box-shadow:none;">'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected block not found: {old}')
              text = text.replace(old, new, 1)

          old_img = 'style="width:100%; height:100%; object-fit:contain; display:block;"'
          if text.count(old_img) < 2:
              raise SystemExit('Expected image styles not found twice')
          text = text.replace(old_img, 'style="width:100%; height:100%; object-fit:cover; display:block;"', 2)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove white frame from image cards"
          git push
