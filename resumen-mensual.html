  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    :root { --red:#e30613; --red-dark:#b9000b; --red-soft:#fff0f1; --ink:#161616; --muted:#6e6e73; --paper:#fff; --surface:#f5f5f7; }
    html, body { width:100%; overflow-x:hidden; }
    body { min-height:100vh; padding-bottom:calc(34px + env(safe-area-inset-bottom)); color:var(--ink); background:var(--surface); font-family:Arial,Helvetica,sans-serif; }
    .top { position:sticky; top:0; z-index:10; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid #e3e3e6; background:rgba(245,245,247,.96); backdrop-filter:blur(12px); }
    .top-inner { display:flex; align-items:center; gap:13px; width:min(100%,900px); margin:auto; }
    .back { display:grid; flex:0 0 42px; width:42px; height:42px; place-items:center; border-radius:50%; color:var(--red); background:var(--paper); box-shadow:0 3px 12px rgba(0,0,0,.08); font-size:27px; font-weight:800; line-height:1; text-decoration:none; }
    h1 { font-size:clamp(23px,6vw,30px); line-height:1.05; }
    main { display:grid; gap:18px; width:min(100%,900px); margin:auto; padding:22px 14px 0; }
    .feed { display:grid; gap:16px; }
    .post { overflow:hidden; border-radius:24px; color:#fff; background:var(--red); box-shadow:0 6px 22px rgba(0,0,0,.08); }
    .post-body { padding:18px; }
    .post-compact { border-radius:16px; box-shadow:none; }
    .post-link { display:grid; grid-template-columns:60px minmax(0,1fr) 20px; align-items:center; gap:14px; padding:12px; color:inherit; text-decoration:none; }
    .post-link:focus-visible { outline:3px solid #fff; outline-offset:-5px; }
    .post-link img { display:block; width:60px; height:84px; object-fit:cover; border-radius:9px; }
    .post-link h2 { font-size:18px; line-height:1.15; }
    @media (max-width:380px) {
      .post-link h2 .post-title-separator { display:none; }
      .post-link h2 .post-title-ending { display:block; }
    }
    .post-link .post-date { margin:7px 0 0; font-size:12px; }
    .post-chevron { justify-self:center; font-size:31px; line-height:1; }
    .post-date { display:flex; align-items:center; gap:7px; margin-bottom:10px; color:inherit; font-size:13px; font-weight:700; }
    .post-category { display:block; margin-bottom:7px; color:inherit; font-size:12px; font-weight:900; letter-spacing:.7px; text-transform:uppercase; }
    .post h2 { margin-bottom:8px; font-size:clamp(21px,5.7vw,27px); line-height:1.12; }
    .post p { color:inherit; font-size:15px; line-height:1.5; }
    .post-actions { display:flex; gap:10px; margin-top:17px; }
    .primary { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0 18px; border-radius:999px; color:var(--red-dark); background:var(--red-soft); font-size:14px; font-weight:900; text-decoration:none; }
    .post-actions .primary { flex:1; border:1px solid #fff; color:#fff; background:var(--red); }
    .post-actions .primary:hover { background:var(--red-dark); }
    @media (min-width:700px) { main { padding-top:30px; } .post-body { padding:22px 24px 24px; } }
    a:focus-visible { outline:3px solid var(--red); outline-offset:4px; }
  </style>
</head>

    if (!MONTHLY_SUMMARIES.length) {
      const empty = document.createElement('p');
      empty.textContent = 'Todavía no hay contenido aquí';
      feed.append(empty);
    }

    for (const summary of [...MONTHLY_SUMMARIES].sort((a, b) => b.date.localeCompare(a.date))) {
      const thumbnail = thumbnails.get(summary.url);
      const card = (thumbnail ? compactTemplate : template).content.cloneNode(true);
      if (thumbnail) {
        const [month, subtitle] = summary.title.split(' · ');
        card.querySelector('.post-title-month').textContent = month;
        card.querySelector('.post-title-ending').textContent = subtitle;
        card.querySelector('img').src = thumbnail;
      } else {
        card.querySelector('h2').textContent = summary.title;
        card.querySelector('p').textContent = summary.summary;
      }
      const date = card.querySelector('time');
      if (thumbnail) {
        date.remove();
      } else {
        date.dateTime = summary.date;
        date.textContent = formatDate.format(new Date(summary.date));
      }
      const link = card.querySelector('a');
      link.href = summary.url;
      link.setAttribute('aria-label', 'Ver ficha de ' + summary.title);
      feed.append(card);
    }
