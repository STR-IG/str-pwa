<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Pregúntale a STR-IG · Demo</title>
  <link rel="icon" type="image/png" href="icono-str-ig.png">
  <link rel="apple-touch-icon" href="icono-str-ig.png">
  <link rel="manifest" href="manifest.json">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{--red:#e30613;--black:#161616;--grey:#6e6e73;--light:#f5f5f7;--white:#fff}body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--black)}.top{position:sticky;top:0;z-index:20;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid #e4e4e7;background:rgba(245,245,247,.96);backdrop-filter:blur(12px)}.top-inner{display:flex;align-items:center;gap:14px;max-width:900px;margin:auto}.back{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:50%;color:var(--red);background:var(--white);box-shadow:0 3px 12px rgba(0,0,0,.08);text-decoration:none;font-size:26px;font-weight:700}h1{font-size:27px;line-height:1.05}main{max-width:900px;margin:auto;padding:28px 18px 48px}.intro{margin-bottom:20px;color:var(--grey);font-size:15px;line-height:1.5}.options-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;align-items:start}.option-card{display:block;width:100%;border-radius:20px;color:inherit;text-decoration:none;transition:.2s ease}.option-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,0,0,.1)}.option-card img{display:block;width:100%;height:auto;border-radius:15px}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><a class="back" href="demo-app.html" aria-label="Volver a la demo">‹</a><h1>Pregúntale a STR-IG</h1></div></header>
  <main>
    <p class="intro">Selecciona la consulta que quieres realizar.</p>
    <div class="options-grid">
      <a class="option-card" href="demo-preguntale-str-permisos.html" aria-label="Abrir Permisos retribuidos en la demo">
        <img src="preguntale-str-permisos.png" alt="Permisos retribuidos">
      </a>
    </div>
  </main>
</body>
</html>
