<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://icneigdnuntzugisexaz.supabase.co',KEY='sb_publishable_apKjcPClIBTHS2wwN6qPsA_6Vm4tk9m',PAGE='preguntale-fallecimiento-familiar.html';const supabase=createClient(URL,KEY,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});async function hasPrivateAccess(session){if(!session)return false;const{data,error}=await supabase.rpc('is_current_user_private_access_allowed');return!error&&data===true}const{data:{session}}=await supabase.auth.getSession();if(!(await hasPrivateAccess(session))){if(session)await supabase.auth.signOut();sessionStorage.setItem('strAfterLogin',PAGE);window.location.replace(`acceso-privado.html?next=${PAGE}`)}else{document.getElementById('auth-check').hidden=true;document.getElementById('content').hidden=false}const relationship=document.getElementById('relationship'),button=document.getElementById('continue'),saved=sessionStorage.getItem('strBereavementRelationship')||'';if(saved){const option=[...relationship.options].find(item=>item.text===saved);if(option)relationship.selectedIndex=option.index}function update(){button.disabled=!relationship.value}relationship.addEventListener('change',update);update();button.addEventListener('click',()=>{const option=relationship.options[relationship.selectedIndex];if(!option?.value)return;sessionStorage.setItem('strBereavementRelationship',option.text);sessionStorage.setItem('strBereavementRelationshipScope',option.dataset.scope||'review');window.location.href='preguntale-fallecimiento-fecha.html'});</script></body></html>
