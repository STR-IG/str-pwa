<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Actividad e información sindical · STR-IG</title>
  <link rel="icon" type="image/png" href="icono-str-ig.png">
  <link rel="apple-touch-icon" href="icono-str-ig.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    :root { --red:#e30613; --red-dark:#b9000b; --red-soft:#fff0f1; --ink:#161616; --muted:#6e6e73; --paper:#fff; --surface:#f5f5f7; }
    html, body { width:100%; overflow-x:hidden; }
    body { min-height:100vh; padding-bottom:calc(34px + env(safe-area-inset-bottom)); color:var(--ink); background:var(--surface); font-family:Arial,Helvetica,sans-serif; }
    .top { position:sticky; top:0; z-index:10; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid #e3e3e6; background:rgba(245,245,247,.96); backdrop-filter:blur(12px); }
    .top-inner { display:flex; align-items:center; gap:13px; width:min(100%,900px); margin:auto; }
    .back { display:grid; flex:0 0 42px; width:42px; height:42px; place-items:center; border-radius:50%; color:var(--red); background:var(--paper); box-shadow:0 3px 12px rgba(0,0,0,.08); font-size:27px; font-weight:800; line-height:1; text-decoration:none; }
    h1 { font-size:clamp(23px,6vw,30px); line-height:1.05; }
    main { display:grid; gap:18px; width:min(100%,900px); margin:auto; padding:22px 14px 0; }
    .feed { display:grid; gap:16px; }
    .post { overflow:hidden; border-radius:24px; background:var(--paper); box-shadow:0 6px 22px rgba(0,0,0,.08); }
    .post-link { display:block; color:inherit; text-decoration:none; }
    .photo-navigation-row { display:grid; grid-template-columns:82px minmax(0,1fr); gap:8px; }
    .photo-navigation-thumbnail { position:relative; overflow:hidden; border-radius:9px; }
    .photo-navigation-link { display:grid; grid-template-columns:minmax(0,1fr) 20px; min-height:96px; box-sizing:border-box; align-items:center; gap:12px; padding:12px; border-radius:16px; color:#fff; background:var(--red); text-decoration:none; }
    .photo-navigation-link .navigation-copy { padding-left:4px; }
    .photo-navigation-link h2 { font-size:18px; line-height:1.15; }
    .photo-navigation-thumbnail img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .photo-navigation-arrow { justify-self:center; font-size:31px; line-height:1; }
    .photo-navigation-link:focus-visible { outline:3px solid #fff; outline-offset:-5px; }
    .post-media { position:relative; display:block; width:100%; background:#111; }
    .post-media img { display:block; width:100%; height:auto; }
    .news-notification-badge { position:absolute; top:8px; right:8px; z-index:5; min-width:28px; height:28px; padding:0 8px; border:2px solid #fff; border-radius:999px; display:none; align-items:center; justify-content:center; color:#fff; background:var(--red); box-shadow:0 3px 10px rgba(0,0,0,.24); font-size:15px; line-height:1; font-weight:900; }
    .news-notification-badge.show { display:flex; }
    .new-badge { position:absolute; top:12px; left:12px; padding:7px 11px; border:2px solid #fff; border-radius:999px; color:#fff; background:var(--red); box-shadow:0 3px 10px rgba(0,0,0,.18); font-size:11px; font-weight:900; letter-spacing:.45px; }
    .post-body { padding:18px; }
    .post-date { display:flex; align-items:center; gap:7px; margin-bottom:10px; color:var(--muted); font-size:13px; font-weight:700; }
    .post-category { display:block; margin-bottom:7px; color:var(--red); font-size:12px; font-weight:900; letter-spacing:.7px; text-transform:uppercase; }
    .post h3 { margin-bottom:8px; font-size:clamp(21px,5.7vw,27px); line-height:1.12; }
    .post p { color:var(--muted); font-size:15px; line-height:1.5; }
    .monthly-access { color:var(--paper); background:var(--red); }
    .monthly-access p { color:inherit; }
    .monthly-access .post-actions { font-size:14px; font-weight:900; }
    .monthly-access:hover { background:var(--red-dark); }
    .post-actions { display:flex; gap:10px; margin-top:17px; }
    .primary { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0 18px; border-radius:999px; color:var(--red-dark); background:var(--red-soft); font-size:14px; font-weight:900; text-decoration:none; }
    .post-actions .primary { flex:1; color:#fff; background:var(--red); }
    .post-actions .primary:hover { background:var(--red-dark); }
    .home { display:block; margin-top:2px; padding:15px 18px; border-radius:999px; color:#555; background:#e8e8eb; font-size:14px; font-weight:800; text-align:center; text-decoration:none; }
    @media (min-width:700px) { main { padding-top:30px; } .post-body { padding:22px 24px 24px; } }
    a:focus-visible { outline:3px solid var(--red); outline-offset:4px; }
    .post .documentation-heading { margin:0; }
    .documentation-link { position:relative; }
    .documentation-link .post-actions { margin-top:12px; }
    #documentation-title { display:block; }
    .achievements-link { display:flex; align-items:center; justify-content:space-between; gap:12px; color:#fff; background:var(--red); font-size:clamp(21px,5.7vw,27px); font-weight:800; line-height:1.12; }

    .section-title { font-size:16px; font-weight:800; }
    .monthly-access { position:relative; }
    .monthly-access .post-category, .monthly-access .post-date { color:inherit; }
    .monthly-access .primary { border:1px solid #fff; }
    .previous { display:block; width:fit-content; margin-top:14px; padding:8px 0; color:#fff; font-size:14px; }
    .achievements-link { display:block; padding:15px 18px; font-size:15px; text-align:center; white-space:nowrap; }
    .more { display:block; padding:14px; color:var(--red-dark); font-weight:800; text-align:center; }
    .monthly-access a:focus-visible { outline-color:#fff; }
    [hidden] { display:none !important; }

    .navigation-card { position:relative; display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:94px; padding:22px; color:#fff; background:var(--red); text-decoration:none; }
    .navigation-card h2 { margin:0; font-size:clamp(21px,5.7vw,27px); line-height:1.15; }
    .navigation-copy { min-width:0; }
    .navigation-copy small { display:block; margin-top:7px; font-size:clamp(10px,2.8vw,13px); line-height:1.3; white-space:nowrap; }
    .navigation-card .arrow { flex:none; font-size:30px; }
    .navigation-card:hover { background:var(--red-dark); }
    .navigation-card:focus-visible { outline-offset:4px; }
    .meeting-card { color:#fff; background:var(--red); }
    .meeting-card :is(p, .post-date, .related) { color:inherit; }
    .meeting-card .post-actions .primary { border:1px solid #fff; }
    .meeting-card a:focus-visible { outline-color:#fff; }
    .activity-project-detail > * + * { margin-top:12px; }
    .activity-project-detail ul { padding-inline-start:20px; font-size:15px; line-height:1.5; }
    .activity-project-detail .activity-status { font-weight:700; }
    .content-card { position:relative; padding:20px; }
    .content-card h2 { margin-bottom:10px; font-size:22px; line-height:1.2; }
    .content-card h3 { margin:20px 0 7px; font-size:18px; }
    .content-card p + p { margin-top:12px; }
    .status { display:inline-block; margin-bottom:12px; padding:5px 10px; border-radius:999px; color:var(--red-dark); background:var(--red-soft); font-size:13px; font-weight:800; }
    .related { display:block; padding:12px 0; color:var(--red-dark); font-size:15px; font-weight:800; line-height:1.4; }
    .content-image { display:block; width:100%; height:auto; margin-bottom:18px; border-radius:18px; }
    .empty { padding:20px; color:var(--muted); }
    .category-heading { font-size:19px; line-height:1.3; }
    .group { display:grid; gap:16px; }
    .page-intro { color:var(--muted); font-size:14px; line-height:1.4; }
    .topic-card { padding:18px; scroll-margin-top:90px; }
    .topic-card h2 { font-size:clamp(21px,5.7vw,27px); line-height:1.12; }
    .topic-metadata { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; margin-bottom:14px; }
    .topic-metadata .status, .topic-metadata .post-date { margin:0; }
    .topic-open { color:#fff; background:var(--red); }
    .topic-open p, .topic-open .post-date { color:inherit; }
    .topic-open .status { color:var(--red); background:#fff; }
    .topic-open .primary { border:1px solid #fff; color:#fff; background:transparent; }
    .topic-open .primary:hover { background:var(--red-dark); }
    .topic-open a:focus-visible { outline-color:#fff; }
    .topic-closed .status { color:#555; background:#e8e8eb; }
    .resolved-topics > summary { padding:14px 0; font-size:18px; font-weight:800; cursor:pointer; }
    @media (min-width:700px) { .topic-card { padding:22px 24px 24px; } }
      #activity-content:has(> .navigation-card) { grid-auto-rows:1fr; }
    .navigation-card { display:grid; grid-template-columns:auto minmax(0,1fr) auto; }
    .navigation-icon { display:grid; place-items:center; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.18); }
    .navigation-icon svg { width:25px; height:25px; }
    .navigation-icon.navigation-thumbnail { width:72px; height:72px; flex:none; overflow:hidden; border-radius:10px; background:#fff; }
    .navigation-thumbnail img { display:block; width:100%; height:100%; object-fit:cover; }
    .navigation-card h2 { font-size:clamp(21px,5.4vw,22px); }
    .navigation-copy small { margin-top:4px; color:#fff; opacity:1; font-size:13px; font-weight:500; white-space:normal; }
    @media (max-width:480px) {
      .navigation-card { gap:10px; padding:12px 14px; }
      .navigation-icon { width:38px; height:38px; }
      .navigation-icon svg { width:22px; height:22px; }
      .navigation-icon.navigation-thumbnail { width:60px; height:60px; }
    }
    .navigation-card-sharepoint {
      grid-template-columns:minmax(64px,28%) minmax(0,1fr) auto;
      align-items:stretch;
      padding:0 16px 0 0;
    }
    .navigation-card-sharepoint .navigation-icon.navigation-thumbnail {
      position:relative;
      width:100%;
      height:100%;
      border-radius:0;
      background:transparent;
      -webkit-mask-image:linear-gradient(to right,#000 68%,transparent);
      mask-image:linear-gradient(to right,#000 68%,transparent);
    }
    .navigation-card-sharepoint .navigation-thumbnail img { position:absolute; inset:0; }
    .navigation-card-sharepoint .navigation-copy { align-self:center; padding-block:13px; }
    .navigation-card-sharepoint .arrow { align-self:center; }
    .activity-hub .top { position:static; padding-inline:18px; border-bottom:0; backdrop-filter:none; }
    .activity-hub .top-inner { flex-direction:column; align-items:flex-start; gap:6px; }
    .activity-hub h1 { max-width:20ch; font-size:clamp(26px,6.4vw,36px); }
    .activity-hub main { gap:10px; padding:16px 8px 0; }
    .activity-hub .navigation-card { min-height:68px; gap:10px; padding:8px 12px; border-radius:12px; box-shadow:none; }
    .activity-hub .navigation-icon.navigation-thumbnail { width:48px; height:48px; border-radius:10px; }
    .activity-hub .navigation-card h2 { font-size:clamp(16px,4.25vw,21px); }
    .activity-hub .navigation-copy small { font-size:clamp(12px,3.2vw,15px); }
    .activity-hub .navigation-card .arrow { font-size:24px; line-height:1; }
  </style>
  <link rel="stylesheet" href="logros.css">
</head>
<body>
  <header class="top"><div class="top-inner"><a class="back" href="app.html" aria-label="Volver al menú principal">‹</a><h1>Actividad e información sindical</h1></div></header>
  <main id="activity-content">
    <noscript>Activa JavaScript para consultar las publicaciones sindicales.</noscript>
  </main>
  <script type="module" src="./actividad-informacion-sindical.js?v=boton-pluses-navidad"></script>
  <script type="module" src="./app-analytics.js?v=2-card-counts"></script>
</body>
</html>
