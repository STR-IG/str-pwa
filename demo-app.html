<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Demo · STR-IG</title>
  <link rel="icon" type="image/png" href="icono-str-ig.png">
  <link rel="apple-touch-icon" href="icono-str-ig.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    :root { --red:#e30613; --red-dark:#b9000b; --black:#161616; --grey:#6e6e73; --light:#f5f5f7; --white:#fff; }
    body { font-family:Arial,Helvetica,sans-serif; background:var(--light); color:var(--black); padding-bottom:calc(92px + env(safe-area-inset-bottom)); }
    .top { position:sticky; top:0; z-index:20; background:rgba(245,245,247,.96); backdrop-filter:blur(12px); border-bottom:1px solid #e4e4e7; padding:calc(14px + env(safe-area-inset-top)) 18px 14px; }
    .top-inner { max-width:900px; margin:auto; display:flex; align-items:center; gap:14px; }
    .back { width:42px; height:42px; flex:0 0 42px; border-radius:50%; background:var(--white); display:grid; place-items:center; text-decoration:none; color:var(--red); font-size:26px; font-weight:700; box-shadow:0 3px 12px rgba(0,0,0,.08); }
    h1 { font-size:27px; line-height:1.05; }
    main { max-width:900px; margin:auto; padding:22px 18px 34px; }
    .intro { color:var(--grey); font-size:15px; line-height:1.45; margin-bottom:20px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; align-items:stretch; }
    .demo-card { position:relative; display:block; width:100%; aspect-ratio:1.5/1; overflow:hidden; border-radius:20px; background:var(--white); box-shadow:0 5px 18px rgba(0,0,0,.07); text-decoration:none; color:inherit; }
    .demo-card img { width:100%; height:100%; display:block; object-fit:cover; }
    .demo-badge { position:absolute; top:10px; right:10px; z-index:3; padding:7px 11px; border-radius:999px; color:var(--white); background:var(--red); box-shadow:0 3px 10px rgba(0,0,0,.18); font-size:11px; font-weight:900; letter-spacing:.8px; }
    .demo-card.pending::after { position:absolute; left:10px; bottom:10px; z-index:2; content:"Demo"; padding:6px 9px; border-radius:999px; color:var(--red-dark); background:rgba(255,255,255,.94); font-size:11px; font-weight:800; }
    .v-card { background:linear-gradient(145deg,#fff 0%,#fff7f7 70%,#ffe8ea 100%); padding:16px; }
    .v-visual { height:100%; display:flex; flex-direction:column; justify-content:space-between; }
    .v-kicker { font-size:10px; font-weight:900; letter-spacing:.9px; color:#777; }
    .v-title { margin-top:6px; font-size:22px; font-weight:900; line-height:1; letter-spacing:-.8px; }
    .v-title .v { color:var(--red); font-size:33px; }
    .v-sub { margin-top:6px; max-width:82%; color:#666; font-size:11px; line-height:1.3; }
    .v-bottom { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
    .v-docs { display:flex; align-items:flex-end; gap:5px; }
    .sheet { width:28px; height:38px; border-radius:5px; background:#fff; border:1px solid #dedede; box-shadow:0 3px 8px rgba(0,0,0,.08); position:relative; }
    .sheet::before,.sheet::after { content:""; position:absolute; left:5px; right:5px; height:2px; background:#dedede; border-radius:2px; }
    .sheet::before { top:12px; box-shadow:0 6px 0 #e7e7e7,0 12px 0 #e7e7e7; }
    .sheet.red { transform:rotate(-7deg); border-color:#f2b5ba; }
    .calc { width:38px; height:46px; border-radius:8px; background:#202124; padding:5px; box-shadow:0 4px 10px rgba(0,0,0,.14); }
    .calc-screen { height:9px; border-radius:3px; background:#d7e7d8; margin-bottom:4px; }
    .calc-keys { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; }
    .calc-keys i { display:block; height:6px; border-radius:2px; background:#f0f0f0; }
    .v-arrow { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--red); color:#fff; font-size:18px; font-weight:900; }
    .bottom-nav { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:1100px; min-height:76px; padding-bottom:env(safe-area-inset-bottom); background:rgba(255,255,255,.97); backdrop-filter:blur(12px); border-top:1px solid #e5e5e5; display:flex; justify-content:space-around; align-items:center; z-index:50; }
    .bottom-nav a { text-decoration:none; color:#666; text-align:center; font-size:11px; min-width:58px; }
    .bottom-nav a b { display:block; font-size:21px; margin-bottom:4px; }
    .bottom-nav a.active { color:var(--red); font-weight:800; }
    @media (min-width:700px) { .grid { grid-template-columns:repeat(3,1fr); } }
  </style>
</head>
<body>

      <a class="demo-card v-card" href="demo-calcula-v.html" aria-label="Demo Calcula tu V">
        <span class="demo-badge">DEMO</span>
        <div class="v-visual">
          <div><div class="v-kicker">CALCULA TU</div><div class="v-title"><span class="v">V</span> · Demo</div><div class="v-sub">Descubre cómo revisamos el importe de tus vacaciones.</div></div>
          <div class="v-bottom"><div class="v-docs"><span class="sheet red"></span><span class="sheet"></span><span class="calc"><span class="calc-screen"></span><span class="calc-keys"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span></div><span class="v-arrow">›</span></div>
        </div>
      </a>

    </div>
  </main>
  <nav class="bottom-nav"><a class="active" href="index.html"><b>⌂</b>Inicio</a><a href="index.html"><b>⚖</b>Derechos</a><a href="index.html"><b>📰</b>Actualidad</a><a href="index.html"><b>👥</b>Sindicato</a><a href="index.html"><b>♡</b>Afíliate</a><a href="index.html"><b>☎</b>Contacto</a></nav>
</body>
</html>
