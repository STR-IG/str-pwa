<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Demo · STR-IG</title>
  <link rel="icon" type="image/png" href="icono-str-ig.png">
  <link rel="apple-touch-icon" href="icono-str-ig.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red:#e30613;
      --red-dark:#b9000b;
      --red-soft:#fff0f1;
      --black:#161616;
      --grey:#6e6e73;
      --light:#f5f5f7;
      --white:#fff;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--black);
      padding-bottom: calc(92px + env(safe-area-inset-bottom));
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245,245,247,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e4e4e7;
      padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
    }
    .top-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .back {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 50%;
      background: var(--white);
      display: grid;
      place-items: center;
      text-decoration: none;
      color: var(--red);
      font-size: 26px;
      font-weight: 700;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    h1 { font-size: 27px; line-height: 1.05; }
    main { max-width: 900px; margin: auto; padding: 22px 18px 34px; }
    .intro { color: var(--grey); font-size: 15px; line-height: 1.45; margin-bottom: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 14px;
      align-items: stretch;
    }
    .demo-card {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1.5 / 1;
      overflow: hidden;
      border-radius: 20px;
      background: var(--white);
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
      text-decoration: none;
      color: inherit;
    }
    .demo-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .demo-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      padding: 7px 11px;
      border-radius: 999px;
      color: var(--white);
      background: var(--red);
      box-shadow: 0 3px 10px rgba(0,0,0,.18);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .8px;
    }
    .demo-card.pending::after {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 2;
      content: "Demo";
      padding: 6px 9px;
      border-radius: 999px;
      color: var(--red-dark);
      background: rgba(255,255,255,.94);
      font-size: 11px;
      font-weight: 800;
    }
    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 1100px;
      min-height: 76px;
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(12px);
      border-top: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }
    .bottom-nav a {
      text-decoration: none;
      color: #666;
      text-align: center;
      font-size: 11px;
      min-width: 58px;
    }
    .bottom-nav a b { display: block; font-size: 21px; margin-bottom: 4px; }
    .bottom-nav a.active { color: var(--red); font-weight: 800; }
    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="back" href="index.html" aria-label="Volver a Inicio">‹</a>
      <h1>Prueba la demo</h1>
    </div>
  </header>

  <main>
    <p class="intro">Elige una herramienta y descubre cómo funciona con datos de ejemplo.</p>

    <div class="grid">
      <a class="demo-card" href="demo-preguntale-str-ig.html" aria-label="Demo de permisos retribuidos: matrimonio">
        <img src="preguntale-str-permisos.png" alt="Permisos retribuidos">
        <span class="demo-badge">DEMO</span>
      </a>

      <a class="demo-card" href="demo-calcula-v.html?v=2" aria-label="Demo Calcula tu V">
        <img src="card-demo-calcula-v.png" alt="Calcula tu V">
        <span class="demo-badge">DEMO</span>
      </a>

      <div class="demo-card pending" aria-label="Demo Revisa tu nómina">
        <img src="revisa-tu-nomina-card.png" alt="Revisa tu nómina">
        <span class="demo-badge">DEMO</span>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a class="active" href="index.html"><b>⌂</b>Inicio</a>
    <a href="index.html"><b>⚖</b>Derechos</a>
    <a href="index.html"><b>📰</b>Actualidad</a>
    <a href="index.html"><b>👥</b>Sindicato</a>
    <a href="index.html"><b>♡</b>Afíliate</a>
    <a href="index.html"><b>☎</b>Contacto</a>
  </nav>
</body>
</html>
