<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e30613"><title>Emergencia climática · Pregúntale a STR-IG</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f7;color:#161616}.top{padding:calc(14px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid #e4e4e7}.top-inner{max-width:680px;margin:auto;display:flex;align-items:center;gap:14px}.back{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#fff;color:#e30613;text-decoration:none;font-size:26px;font-weight:700}h1{font-size:25px}main{max-width:680px;margin:auto;padding:24px 18px}.panel{background:#fff;border-radius:22px;padding:22px;box-shadow:0 6px 22px #00000012}.step{color:#b9000b;font-size:12px;font-weight:900;text-transform:uppercase}h2{font-size:24px;margin:10px 0 8px}.intro{color:#6e6e73;line-height:1.5}.options{display:grid;gap:12px;margin-top:18px}.option{min-height:56px;border:1px solid #ddd;border-radius:15px;background:#fff;font:inherit;font-weight:800}.selected{border-color:#e30613!important;box-shadow:0 0 0 3px #e306131a}.primary{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:999px;background:#e30613;color:#fff;font:inherit;font-weight:800}.primary:disabled{opacity:.45}#auth-check{text-align:center;color:#6e6e73}</style></head><body><header class="top"><div class="top-inner"><a class="back" href="preguntale-str-permisos.html">‹</a><h1>Emergencia climática</h1></div></header><main><p id="auth-check">Comprobando acceso privado…</p><section id="content" hidden><div class="panel"><span class="step">Paso 1 de 8</span><h2>¿Qué situación se ha producido?</h2><p class="intro">Selecciona la opción que mejor describe la situación.</p><div class="options"><button class="option" data-value="Recomendación de no desplazarse">Recomendación de no desplazarse</button><button class="option" data-value="Limitación de desplazamiento">Limitación de desplazamiento</button><button class="option" data-value="Prohibición de desplazamiento">Prohibición de desplazamiento</button><button class="option" data-value="Riesgo grave e inminente">Riesgo grave e inminente</button><button class="option" data-value="Catástrofe">Catástrofe</button><button class="option" data-value="Fenómeno meteorológico adverso">Fenómeno meteorológico adverso</button></div><button id="continue" class="primary" disabled>Continuar</button></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://icneigdnuntzugisexaz.supabase.co',KEY='sb_publishable_apKjcPClIBTHS2wwN6qPsA_6Vm4tk9m',PAGE='preguntale-emergencia-situacion.html';const supabase=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),ac=document.getElementById('auth-check'),ct=document.getElementById('content');const{data:{session}}=await supabase.auth.getSession();const r=session?await supabase.rpc('is_current_user_private_access_allowed'):{data:false};if(r.data!==true){sessionStorage.setItem('strAfterLogin',PAGE);location.replace('acceso-privado.html?next='+PAGE)}else{ac.hidden=true;ct.hidden=false}let v=sessionStorage.getItem('strClimateSituation')||'';const bs=[...document.querySelectorAll('.option')],n=document.getElementById('continue');function paint(){bs.forEach(b=>b.classList.toggle('selected',b.dataset.value===v));n.disabled=!v}bs.forEach(b=>b.onclick=()=>{v=b.dataset.value;paint()});paint();n.onclick=()=>{sessionStorage.setItem('strClimateSituation',v);location.assign('preguntale-emergencia-consulta-oficial.html')};</script></body></html>
