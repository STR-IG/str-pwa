<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Menú del comedor · STR-IG</title>
  <link rel="icon" type="image/png" href="icono-str-ig.png">
  <link rel="apple-touch-icon" href="icono-str-ig.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #e30613;
      --black: #161616;
      --grey: #6e6e73;
      --light: #f5f5f7;
      --white: #fff;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--black);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245,245,247,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e4e4e7;
      padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
    }
    .top-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .back {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 50%;
      background: var(--white);
      display: grid;
      place-items: center;
      text-decoration: none;
      color: var(--red);
      font-size: 26px;
      font-weight: 700;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    h1 { font-size: 27px; line-height: 1.05; }
    main { max-width: 900px; margin: auto; padding: 22px 18px 34px; }
    .intro { color: var(--grey); font-size: 15px; line-height: 1.45; margin-bottom: 20px; }
    .menu-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
      background: var(--white);
    }



</style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="back" href="index.html" aria-label="Volver a Inicio">‹</a>
      <h1>Menú del comedor</h1>
    </div>
  </header>

  <main>
    <p class="intro">Consulta los menús disponibles.</p>

    <img class="menu-img" src="menu-semana-1.png" alt="Menú semana 1">
    <img class="menu-img" src="menu-semana-2.png" alt="Menú semana 2">
    <img class="menu-img" src="menu-semana-3.png" alt="Menú semana 3">
    <img class="menu-img" src="menu-semana-4.png" alt="Menú semana 4">
  </main>

  

  <script type="module">
    import { markCategoryRead } from './novedades.js';
    markCategoryRead('menu');
  </script>
  <script type="module" src="./app-analytics.js"></script>
</body>
</html>
