<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e30613"><title>Inicio del permiso · Matrimonio · Pregúntale a STR-IG</title><link rel="icon" type="image/png" href="icono-str-ig.png"><link rel="apple-touch-icon" href="icono-str-ig.png"><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--red:#e30613;--red-dark:#b9000b;--black:#161616;--grey:#6e6e73;--line:#dddddf;--light:#f5f5f7;--white:#fff}body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--black)}.top{position:sticky;top:0;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid #e4e4e7;background:rgba(245,245,247,.96)}.top-inner{display:flex;align-items:center;gap:14px;max-width:680px;margin:auto}.back{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--red);background:#fff;text-decoration:none;font-size:26px;font-weight:700}h1{font-size:clamp(21px,5vw,27px)}main{max-width:680px;margin:auto;padding:24px 18px 48px}.panel{padding:22px;border-radius:22px;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.07)}.step{display:inline-block;margin-bottom:10px;color:var(--red-dark);font-size:12px;font-weight:900;text-transform:uppercase}h2{margin-bottom:8px;font-size:24px}.intro{margin-bottom:18px;color:var(--grey);line-height:1.5}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice button{min-height:58px;border:1px solid var(--line);border-radius:16px;background:#fff;font:inherit;font-weight:800}.choice button.active{border-color:var(--red);box-shadow:0 0 0 3px rgba(227,6,19,.1);color:var(--red)}.next-date{display:none;margin-top:18px}.next-date.show{display:block}label{display:block;margin-bottom:8px;font-size:14px;font-weight:800}.date-row{display:grid;grid-template-columns:1fr 58px;gap:10px}input[type=date]{width:100%;min-width:0;min-height:58px;padding:0 15px;border:1px solid var(--line);border-radius:16px;background:#fff;font:inherit;font-size:16px}.calendar-button{min-width:58px;min-height:58px;border:1px solid var(--line);border-radius:16px;color:var(--red);background:#fff;font-size:26px}.primary{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:999px;color:#fff;background:var(--red);font:inherit;font-weight:800}.primary:disabled{opacity:.45}#auth-check{text-align:center;color:var(--grey)}</style></head><body><header class="top"><div class="top-inner"><a class="back" href="preguntale-matrimonio-fecha.html" aria-label="Volver">‹</a><h1>Matrimonio / pareja de hecho</h1></div></header><main><p id="auth-check">Comprobando acceso privado…</p><section id="content" hidden><div class="panel"><span class="step">Paso 3 de 4</span><h2>¿Ese día tenías que trabajar?</h2><p class="intro">Esto nos permite determinar cuándo empieza el permiso.</p><div class="choice"><button id="yes" type="button">Sí</button><button id="no" type="button">No</button></div><div id="next-wrap" class="next-date"><label for="next-date">¿Cuál es tu siguiente día laborable?</label><div class="date-row"><input id="next-date" type="date"><button id="open-calendar" class="calendar-button" type="button" aria-label="Abrir calendario">📅</button></div></div><button id="continue" class="primary" type="button" disabled>Ver resultado</button></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://icneigdnuntzugisexaz.supabase.co',KEY='sb_publishable_apKjcPClIBTHS2wwN6qPsA_6Vm4tk9m',PAGE='preguntale-matrimonio-jornada.html';const supabase=createClient(URL,KEY,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});async function allowed(s){if(!s)return false;const{data,error}=await supabase.rpc('is_current_user_private_access_allowed');return!error&&data===true}const{data:{session}}=await supabase.auth.getSession();if(!(await allowed(session))){if(session)await supabase.auth.signOut();sessionStorage.setItem('strAfterLogin',PAGE);location.replace(`acceso-privado.html?next=${PAGE}`)}else{document.getElementById('auth-check').hidden=true;document.getElementById('content').hidden=false}let works=sessionStorage.getItem('strMarriageWorksDay')||'';const yes=document.getElementById('yes'),no=document.getElementById('no'),wrap=document.getElementById('next-wrap'),field=document.getElementById('next-date'),button=document.getElementById('continue');field.value=sessionStorage.getItem('strMarriageNextWorkDate')||'';function valid(v){return /^\d{4}-\d{2}-\d{2}$/.test(v)}function render(){yes.classList.toggle('active',works==='yes');no.classList.toggle('active',works==='no');wrap.classList.toggle('show',works==='no');button.disabled=!(works==='yes'||(works==='no'&&valid(field.value)))}yes.onclick=()=>{works='yes';sessionStorage.removeItem('strMarriageNextWorkDate');render()};no.onclick=()=>{works='no';render()};field.addEventListener('input',render);field.addEventListener('change',render);document.getElementById('open-calendar').onclick=()=>{try{if(typeof field.showPicker==='function')return field.showPicker()}catch{}field.focus();field.click()};render();button.onclick=()=>{if(button.disabled)return;sessionStorage.setItem('strMarriageWorksDay',works);if(works==='no')sessionStorage.setItem('strMarriageNextWorkDate',field.value);sessionStorage.setItem('strMarriageQueryId',crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`);location.assign('preguntale-matrimonio-resultado.html')};</script></body></html>
