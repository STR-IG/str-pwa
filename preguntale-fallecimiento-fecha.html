}const{data:{session}}=await supabase.auth.getSession();if(!(await allowed(session))){if(session)await supabase.auth.signOut();sessionStorage.setItem('strAfterLogin',PAGE);location.replace(`acceso-privado.html?next=${PAGE}`)}else{document.getElementById('auth-check').hidden=true;document.getElementById('content').hidden=false}function valid(v){const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return false;const d=new Date(+m[1],+m[2]-1,+m[3],12);return d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3]}const relation=sessionStorage.getItem('strBereavementRelationship')||'',summary=document.getElementById('summary'),form=document.getElementById('form'),field=document.getElementById('death-date'),button=document.getElementById('continue');if(relation){summary.textContent=`Familiar seleccionado: ${relation}`;summary.hidden=false}field.value=sessionStorage.getItem('strBereavementDate')||'';function update(){button.disabled=!valid(field.value)}document.getElementById('open-calendar').onclick=()=>{try{if(typeof field.showPicker==='function')return field.showPicker()}catch{}field.focus();field.click()};['input','change','blur'].forEach(e=>field.addEventListener(e,update));update();form.addEventListener('submit',e=>{e.preventDefault();if(!valid(field.value))return field.focus();sessionStorage.setItem('strBereavementDate',field.value);location.assign('preguntale-fallecimiento-desplazamiento.html')});</script></body></html>
