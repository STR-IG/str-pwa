<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="theme-color" content="#f5f6f8">
  <base href="/str-pwa/">
  <title>APP STR-IG · Mantenimiento</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; background: #f5f6f8; color: #202124; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; }
    main { width: min(100%, 560px); padding: clamp(28px, 6vw, 52px); background: #fff; border: 1px solid #e4e7eb; border-radius: 18px; box-shadow: 0 12px 36px rgba(27, 39, 51, .07); text-align: center; }
    h1 { margin: 0 0 18px; font-size: clamp(1.55rem, 4vw, 2rem); line-height: 1.25; }
    p { margin: 0 0 12px; color: #555d66; font-size: 1rem; line-height: 1.65; }
    p:last-child { margin: 24px 0 0; color: #737b84; }
  </style>
</head>
<body>
  <main>
    <h1>Estamos realizando tareas de mantenimiento</h1>
    <p>Estamos actualizando y mejorando algunos contenidos de la APP STR.</p>
    <p>Volveremos a estar disponibles muy pronto.</p>
    <p>Disculpa las molestias.</p>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const scope = new URL('.', document.baseURI).pathname;
          const worker = new URL('service-worker.js', document.baseURI);
          const registration = await navigator.serviceWorker.register(worker, { scope, updateViaCache: 'none' });
          await registration.update();
        } catch (_) {}
      });
    }
  </script>
</body>
</html>
