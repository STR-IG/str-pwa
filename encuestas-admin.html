<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Administrar encuestas · STR-IG</title><link rel="stylesheet" href="encuestas.css"></head><body><header><a href="panel-administracion.html">← Panel de administración</a><a href="encuestas.html">Participar</a></header><main><section class="hero"><p class="eyebrow">ADMINISTRACIÓN STR</p><h1>Encuestas</h1><p>Crea encuestas de respuesta única y consulta resultados agregados.</p></section><p id="status" role="status" aria-live="polite">Comprobando acceso…</p><section id="admin-content" hidden><form id="create-form" class="panel"><h2>Nueva encuesta</h2><label for="title">Pregunta</label><input id="title" maxlength="180" required><label for="description">Descripción</label><textarea id="description" maxlength="1500"></textarea><label for="new-options">Opciones (una por línea; de 2 a 10)</label><textarea id="new-options" rows="5" required></textarea><label class="choice"><input id="admin-only" type="checkbox" checked><span>Solo administradores (prueba privada)</span></label><p>Se crea como borrador. Al activar, la pregunta y las opciones quedan fijadas. El cierre es definitivo.</p><button type="submit">Crear borrador</button></form><section id="surveys" aria-label="Gestión de encuestas"></section><section id="results" class="panel" aria-live="polite" hidden></section></section></main><script type="module" src="encuestas-admin.js"></script></body></html>
