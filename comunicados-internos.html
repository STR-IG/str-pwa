<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Comunicados internos · STR-IG</title>
  <link rel="icon" type="image/png" href="icono-str-ig.png">
  <link rel="apple-touch-icon" href="icono-str-ig.png">
  <link rel="manifest" href="manifest.json">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f5f7;color:#18181b;font-family:Arial,Helvetica,sans-serif}.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 18px;background:#fff;border-bottom:1px solid #e5e5e7}.back{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:#18181b;background:#f0f0f2;text-decoration:none;font-size:25px}.topbar strong{font-size:18px}main{width:min(100% - 28px,780px);margin:0 auto;padding:28px 0 calc(48px + env(safe-area-inset-bottom))}h1{margin:0 0 8px;font-size:30px}.intro{margin:0 0 24px;color:#6e6e73;line-height:1.5}.status{padding:18px;border-radius:18px;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.06);color:#6e6e73}.communications{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.communication{padding:0;overflow:hidden;border:0;border-radius:20px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.09);cursor:pointer;text-align:left}.communication img{display:block;width:100%;height:auto}.communication span{display:block;padding:14px 16px;font-weight:800}.viewer{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:rgba(0,0,0,.92);padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}.viewer.open{display:flex}.viewer-bar{display:flex;justify-content:flex-end;padding-bottom:12px}.close{min-width:46px;min-height:46px;border:0;border-radius:50%;color:#18181b;background:#fff;font-size:27px;cursor:pointer}.viewer-scroll{flex:1;overflow:auto;text-align:center;-webkit-overflow-scrolling:touch}.viewer img{display:block;width:min(100%,900px);height:auto;margin:0 auto;background:#fff}.private-content[hidden]{display:none}@media(max-width:620px){.communications{grid-template-columns:1fr}h1{font-size:27px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="back" href="index.html" aria-label="Volver a la portada">‹</a><strong>Comunicados internos</strong></header>
  <main>
    <div id="checking" class="status" role="status">Comprobando el acceso privado…</div>
    <section id="private-content" class="private-content" hidden>
      <h1>Comunicados internos</h1>
      <p class="intro">Información exclusiva para personas afiliadas a STR-IG.</p>
      <div class="communications">
        <button class="communication" type="button" data-news-id="internal-data-affiliation-2026-09" aria-label="Abrir comunicado sobre datos de afiliación">
          <img id="communication-preview" alt="Comunicado sobre datos de afiliación" loading="eager">
          <span>Datos de afiliación</span>
        </button>
      </div>
    </section>
  </main>
  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Comunicado sobre datos de afiliación" aria-hidden="true">
    <div class="viewer-bar"><button id="close-viewer" class="close" type="button" aria-label="Cerrar comunicado">×</button></div>
    <div class="viewer-scroll"><img id="communication-image" alt="Comunicado sobre datos de afiliación completo"></div>
  </div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { markNewsRead } from './novedades.js';

    const SUPABASE_URL='https://icneigdnuntzugisexaz.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY='sb_publishable_apKjcPClIBTHS2wwN6qPsA_6Vm4tk9m';
    const STORAGE_BUCKET='comunicados-internos';
    const STORAGE_PATH='2026/09/comunicado-datos-afiliacion.png';
    const SIGNED_URL_TTL_SECONDS=300;
    const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});
    const checking=document.getElementById('checking');
    const content=document.getElementById('private-content');
    const viewer=document.getElementById('viewer');
    const closeViewer=document.getElementById('close-viewer');
    const preview=document.getElementById('communication-preview');
    const communicationImage=document.getElementById('communication-image');

    function requirePrivateAccess(){
      window.location.replace('acceso-privado.html?next=comunicados-internos.html');
    }

    const {data:{session},error:sessionError}=await supabase.auth.getSession();
    if(sessionError||!session){
      requirePrivateAccess();
    }else{
      const [{data:{user},error:userError},{data:allowed,error:accessError}]=await Promise.all([
        supabase.auth.getUser(),
        supabase.rpc('is_current_user_private_access_allowed')
      ]);
      if(userError||!user||accessError||allowed!==true){
        await supabase.auth.signOut();
        requirePrivateAccess();
      }else{
        const {data:signedFile,error:signedUrlError}=await supabase.storage
          .from(STORAGE_BUCKET)
          .createSignedUrl(STORAGE_PATH,SIGNED_URL_TTL_SECONDS);
        if(signedUrlError||!signedFile?.signedUrl){
          console.error('No se ha podido cargar el comunicado privado',signedUrlError);
          checking.textContent='No se ha podido cargar el comunicado. Inténtalo de nuevo en unos minutos.';
        }else{
          preview.src=signedFile.signedUrl;
          communicationImage.src=signedFile.signedUrl;
          checking.hidden=true;
          content.hidden=false;
        }
      }
    }

    function closeCommunication(){
      viewer.classList.remove('open');
      viewer.setAttribute('aria-hidden','true');
      document.body.style.overflow='';
    }

    document.querySelectorAll('[data-news-id]').forEach((button)=>{
      button.addEventListener('click',async()=>{
        if(!communicationImage.src)return;
        viewer.classList.add('open');
        viewer.setAttribute('aria-hidden','false');
        document.body.style.overflow='hidden';
        closeViewer.focus();
        if(communicationImage.complete&&communicationImage.naturalWidth>0){
          await markNewsRead([button.dataset.newsId]);
        }else{
          communicationImage.addEventListener('load',()=>markNewsRead([button.dataset.newsId]),{once:true});
        }
      });
    });
    closeViewer.addEventListener('click',closeCommunication);
    viewer.addEventListener('click',(event)=>{if(event.target===viewer)closeCommunication()});
    document.addEventListener('keydown',(event)=>{if(event.key==='Escape')closeCommunication()});
  </script>
</body>
</html>
