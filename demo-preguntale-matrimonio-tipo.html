<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e30613"><title>Matrimonio o pareja de hecho · Demo</title><link rel="icon" type="image/png" href="icono-str-ig.png"><link rel="apple-touch-icon" href="icono-str-ig.png"><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--red:#e30613;--red-dark:#b9000b;--black:#161616;--grey:#6e6e73;--line:#dddddf;--light:#f5f5f7;--white:#fff}body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--black)}.top{position:sticky;top:0;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid #e4e4e7;background:rgba(245,245,247,.96)}.top-inner{display:flex;align-items:center;gap:14px;max-width:680px;margin:auto}.back{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--red);background:#fff;text-decoration:none;font-size:26px;font-weight:700}h1{font-size:clamp(21px,5vw,27px)}main{max-width:680px;margin:auto;padding:24px 18px 48px}.panel{padding:22px;border-radius:22px;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.07)}.step{display:inline-block;margin-bottom:10px;color:var(--red-dark);font-size:12px;font-weight:900;text-transform:uppercase}h2{margin-bottom:8px;font-size:24px}.intro{margin-bottom:18px;color:var(--grey);line-height:1.5}label{display:block;margin-bottom:8px;font-size:14px;font-weight:800}select{width:100%;min-height:56px;padding:0 15px;border:1px solid var(--line);border-radius:15px;background:#fff;font:inherit;font-size:16px}.primary{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:999px;color:#fff;background:var(--red);font:inherit;font-weight:800}.primary:disabled{opacity:.45}</style></head><body><header class="top"><div class="top-inner"><a class="back" href="demo-matrimonio.html" aria-label="Volver">‹</a><h1>Matrimonio / pareja de hecho</h1></div></header><main><section><div class="panel"><span class="step">Paso 1 de 4</span><h2>¿Qué situación vas a formalizar?</h2><p class="intro">Selecciona la opción que corresponda.</p><label for="type">Tipo</label><select id="type"><option value="">Selecciona una opción</option><option value="matrimonio">Matrimonio</option><option value="pareja">Pareja de hecho</option></select><button id="continue" class="primary" type="button" disabled>Continuar</button></div></section></main><script>const field=document.getElementById('type'),button=document.getElementById('continue');field.value=sessionStorage.getItem('strMarriageType')||'';function update(){button.disabled=!field.value}field.addEventListener('change',update);update();button.onclick=()=>{if(!field.value)return;sessionStorage.setItem('strMarriageType',field.value);location.assign('demo-preguntale-matrimonio-fecha.html')};</script></body></html>
