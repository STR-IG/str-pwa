<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Comunicado comedor · STR-IG</title>
  <link rel="icon" type="image/png" href="icono-str-ig.png">
  <link rel="apple-touch-icon" href="icono-str-ig.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    :root { --red:#e30613; --red-dark:#b9000b; --paper:#fff; --surface:#f5f5f7; --muted:#6e6e73; }
    html, body { width:100%; overflow-x:hidden; }
    body { min-height:100vh; padding-bottom:calc(32px + env(safe-area-inset-bottom)); background:var(--surface); color:#161616; font-family:Arial,Helvetica,sans-serif; }
    .top { position:sticky; top:0; z-index:10; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid #e3e3e6; background:rgba(245,245,247,.96); backdrop-filter:blur(12px); }
    .top-inner { display:flex; align-items:center; gap:13px; width:min(100%,900px); margin:auto; }
    .back { display:grid; flex:0 0 42px; width:42px; height:42px; place-items:center; border-radius:50%; color:var(--red); background:var(--paper); box-shadow:0 3px 12px rgba(0,0,0,.08); font-size:27px; font-weight:800; line-height:1; text-decoration:none; }
    h1 { font-size:clamp(23px,6vw,30px); line-height:1.05; }
    main { display:grid; gap:16px; width:min(100%,900px); margin:auto; padding:18px 14px 0; }
    .poster { overflow:hidden; border-radius:22px; background:#fff; box-shadow:0 6px 22px rgba(0,0,0,.08); }
    .poster img { display:block; width:100%; height:auto; }
    .actions { display:grid; gap:10px; }
    .home, .activity { display:flex; align-items:center; justify-content:center; min-height:50px; padding:0 18px; border-radius:999px; font-size:15px; font-weight:900; text-align:center; text-decoration:none; }
    .home { color:#fff; background:var(--red); }
    .activity { color:#555; background:#e8e8eb; }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="back" href="actividad-sindical.html" aria-label="Volver a actividad sindical">‹</a>
      <h1>Comunicado</h1>
    </div>
  </header>
  <main>
    <div class="poster">
      <img src="Cartel-comedor.jpg" alt="Comunicado STR sobre la reunión del comedor del 7 de septiembre de 2026">
    </div>
    <div class="actions">
      <a class="home" href="index.html">⌂ Volver al menú principal</a>
      <a class="activity" href="actividad-sindical.html">Volver a Actividad sindical</a>
    </div>
  </main>
</body>
</html>
