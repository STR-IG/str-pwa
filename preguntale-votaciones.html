<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e30613"><title>Votaciones · Consulta tu caso · STR-IG</title><link rel="icon" href="icono-str-ig.png"><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#161616;font-family:Arial,Helvetica,sans-serif}header,main{max-width:900px;margin:auto;padding:18px}header{display:flex;gap:16px;align-items:center}h1{font-size:26px}h2{font-size:22px}p{line-height:1.5}a{color:#b9000b}.back{font-size:30px;text-decoration:none}.options{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}.option,.panel{background:white;padding:22px;border-radius:20px;box-shadow:0 5px 18px #0001}.option{text-decoration:none;color:inherit}.option strong{display:block;font-size:22px;color:#b9000b}.sheet{width:100%;height:auto;display:block;border-radius:16px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.actions a,button{padding:14px 18px;border-radius:16px;background:#e30613;color:white;border:0;font:inherit;font-weight:bold;text-decoration:none;cursor:pointer}label{display:block;font-weight:bold;margin:18px 0 8px}select,input{width:100%;min-height:48px;padding:10px;font:inherit;border:1px solid #bbb;border-radius:12px}.result{margin-top:20px;border-left:5px solid #0b6b4f;padding:18px;background:#edf8f3;line-height:1.5}.result h2{margin-top:0}[hidden]{display:none!important}:focus-visible{outline:3px solid #161616;outline-offset:3px}@media(max-width:500px){.options{grid-template-columns:1fr}header,main{padding:14px}.panel{padding:16px}}</style></head><body><header><a class="back" href="preguntale-str-permisos.html" aria-label="Volver">‹</a><h1>Votaciones · Consulta tu caso</h1></header><main><div class="panel"><p>Responde según tu jornada del día de votación. La consulta se calcula en este navegador.</p><form id="form"><label for="role">¿Cuál es tu situación?</label><select id="role" required><option value="">Selecciona una opción</option><option value="voter">Voy a votar</option><option value="member">Presidencia o vocalía de mesa</option><option value="substitute">Suplente de mesa</option><option value="interventor">Interventora o interventor</option><option value="proxy">Apoderada o apoderado</option></select><div id="substitute-fields" hidden><label for="serves">¿Finalmente actúas como titular?</label><select id="serves"><option value="">Selecciona una opción</option><option value="yes">Sí</option><option value="no">No, me liberan tras constituir la mesa</option><option value="unknown">Todavía no lo sé</option></select></div><label for="work">¿Te corresponde trabajar el día de votación?</label><select id="work" required><option value="">Selecciona una opción</option><option value="yes">Sí</option><option value="no">No, tengo descanso</option></select><label for="shift">¿Trabajas en turno de noche?</label><select id="shift" required><option value="">Selecciona una opción</option><option value="no">No</option><option value="yes">Sí</option></select><div id="voter-fields" hidden><label for="overlap">Horas de coincidencia con la votación (9:00–20:00)</label><input id="overlap" type="number" min="0" max="11" step="0.25"><label for="part">¿Trabajas a tiempo parcial?</label><select id="part"><option value="no">No</option><option value="yes">Sí</option></select><label for="postal">¿Votas por correo?</label><select id="postal"><option value="no">No</option><option value="yes">Sí</option></select></div><div class="actions"><button type="submit">Ver orientación</button><button type="reset">Empezar de nuevo</button></div></form><section id="result" class="result" role="status" aria-live="polite" hidden><h2 id="result-title"></h2><p id="result-copy"></p><p id="result-extra"></p><div class="actions"><a id="sheet-link" href="voy-a-votar.html">Ver ficha correspondiente</a></div></section></div></main><script src="votaciones-consulta.js" defer></script><script type="module" src="./app-analytics.js"></script></body></html>
